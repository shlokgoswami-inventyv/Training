[package]
name = "student_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization / Deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# (Optional but recommended) Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
